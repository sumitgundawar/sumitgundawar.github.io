name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          # Both lockfiles, or the cache key ignores the Worker's dependencies
          # and its install is uncached on every run.
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The Worker is a separate package with its own lockfile, and the build
      # type-checks it as part of check:worker. Without this step tsc cannot
      # find @cloudflare/workers-types and the build fails here while passing on
      # any machine where the Worker has ever been worked on, which is how this
      # went unnoticed: the checks were added to the build in commits that were
      # never pushed, so CI had not run them until now.
      - name: Install Worker dependencies
        run: npm ci
        working-directory: worker

      # The prerenderer drives a real browser, so the build needs the browser
      # binary and not only the npm package. `npm ci` installs Playwright
      # itself; the browsers are a separate download, which is why the build got
      # all the way to its last step and then failed on a missing executable.
      # --with-deps brings the system libraries Chromium needs on the runner.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4